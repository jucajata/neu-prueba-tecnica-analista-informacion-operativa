services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
      POSTGRES_DB: billing
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./data:/data:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Por TCP: durante la carga inicial el servidor solo escucha por socket,
      # así la API no arranca antes de que termine el seed.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U billing -d billing"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://billing:billing@db:5432/billing
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
